name: Harness Self-Test

# Starter default: manual-only until the project owner enables automatic checks.
# See docs/harness/ci-cd.md for push/pull_request trigger restoration.
on:
  workflow_dispatch:

concurrency:
  group: harness-self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-entrypoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          find scripts -name "*.sh" -print0 | xargs -0 -I{} bash -n "{}"

      - name: Skill trees in sync (.agents/skills == .claude/skills)
        run: |
          # 두 스킬 트리는 수동 복제라 드리프트가 생기기 쉽다 (예: 한쪽에만 스킬 추가).
          # byte 단위 diff로 동기화를 강제한다.
          if [ -d .agents/skills ] && [ -d .claude/skills ]; then
            diff -rq .agents/skills .claude/skills
          else
            echo "skill dirs missing — skip"
          fi

      - name: Template validate
        run: ./scripts/validate.sh

      - name: Template quick validate
        run: ./scripts/validate-quick.sh

  powershell-entrypoints:
    runs-on: windows-latest
    # 비용 가이드: windows-latest는 GitHub Actions 분을 2배로 소비한다. 자동 트리거(push 등)를
    # 켠 프로젝트에서는 모든 push가 아니라 main push + 수동 실행에서만 Windows(Codex/Phase A)
    # 경로를 검증한다. workflow_dispatch 기본 상태에서는 항상 실행된다.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax
        shell: pwsh
        run: |
          # [ref] 대상 변수는 사용 전 반드시 초기화한다. 미초기화 시
          # "[ref] cannot be applied to a variable that does not exist"로 실패한다.
          $failed = $false
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Core PowerShell entrypoints must be native
        shell: pwsh
        run: |
          $entrypoints = @("scripts/validate.ps1", "scripts/validate-quick.ps1", "scripts/smoke.ps1")
          $matches = Select-String -Path $entrypoints -Pattern "Invoke-HarnessBashScript" -SimpleMatch
          if ($matches) {
            $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber) still shells out to Bash" }
            exit 1
          }

      - name: Doctor
        shell: pwsh
        run: ./scripts/doctor.ps1

      - name: Template validate
        shell: pwsh
        run: ./scripts/validate.ps1

      - name: Template quick validate
        shell: pwsh
        run: ./scripts/validate-quick.ps1
