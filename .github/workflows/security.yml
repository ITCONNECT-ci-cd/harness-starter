# .github/workflows/security.yml
#
# 보안 검증 워크플로우 — Phase 1 (시크릿·SAST) + Phase 2 (Trivy)
# 트리거: 기본 수동(workflow_dispatch). 자동화를 켜면 main/develop push, PR,
#         주간 스케줄(매주 월요일 09:00 KST)로 확장 — docs/harness/ci-cd.md 참조.
#
# Jobs:
#   gitleaks      — 시크릿 유출 감지 (히스토리 전체 스캔)
#   codeql        — JavaScript/TypeScript SAST
#   (Phase 2에서 trivy-deps, trivy-image job 추가됨)
#
# 결과는 GitHub Security 탭에 표시됨 (SARIF 업로드).
# PR 차단 조건은 scripts/setup/setup-repo.sh의 branch protection에서 설정.

name: Security

# Starter default: manual-only until the project owner enables security automation.
# See docs/harness/ci-cd.md for push/pull_request/schedule trigger restoration.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 스캔 필수

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    # 비용/플랜 가이드: CodeQL 결과(SARIF)는 GitHub Advanced Security(GHAS)가 있어야
    # Security 탭에 표출된다. GHAS 미사용(특히 무료 private)에서는 분만 소비하므로 기본은
    # 주간 스케줄 + 수동만 실행한다. public/GHAS 프로젝트는 아래 if에 push/PR을 추가하라
    # (public은 분 무료, 결과 표출됨). 상세: docs/harness/ci-cd.md
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # PRIVATE+GHAS 미사용이면 SARIF 업로드가 실패한다. 분석은 수행하되 잡은 깨지 않는다.
        # public/GHAS 전환 시 이 줄을 제거해 업로드 실패를 실제 실패로 취급하라.
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"

  trivy-deps:
    name: trivy-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (dependencies)
        # 버전 고정: @master는 supply-chain 리스크 (Dependabot github-actions가 갱신 제안)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-deps.sarif'

      - name: Upload Trivy deps SARIF
        if: always()
        # PRIVATE+GHAS 미사용 시 업로드 실패가 잡을 깨지 않게 한다(스캔/게이트는 위 단계에서 수행).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-deps.sarif'
          category: trivy-deps

  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    needs: [trivy-deps]
    # 비용 가이드: 이미지 빌드는 비싼 작업이라 기본은 주간 스케줄 + 수동만 실행한다.
    # public 또는 분 여유가 있는 프로젝트는 아래 if에 push/PR을 추가하라. 상세: docs/harness/ci-cd.md
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile — skipping image scan"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.found == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image (scan target)
        if: steps.check.outputs.found == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy image scan
        if: steps.check.outputs.found == 'true'
        # 버전 고정: @master는 supply-chain 리스크 (Dependabot github-actions가 갱신 제안)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'scan-target:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          # 보고 전용(0): base 이미지의 미패치 CVE로 워크플로가 반복 실패하지 않게 한다.
          # CVE를 차단 게이트로 쓰려면 1로 바꾼다(base 이미지 갱신은 Dependabot docker가 제안).
          exit-code: '0'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-image.sarif'

      - name: Upload Trivy image SARIF
        if: always() && steps.check.outputs.found == 'true'
        # PRIVATE+GHAS 미사용 시 업로드 실패가 잡을 깨지 않게 한다.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-image.sarif'
          category: trivy-image
